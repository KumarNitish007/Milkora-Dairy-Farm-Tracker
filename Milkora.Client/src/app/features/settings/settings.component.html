<app-page-header title="Settings" subtitle="Farm info, defaults & sync"></app-page-header>

<div class="grid cols-2">
  <div class="card">
    <h3>Farm information</h3>
    <div class="field mt"><label>Farm Name</label><input class="input" [(ngModel)]="settings.farmName"></div>
    <div class="field"><label>Owner Name</label><input class="input" [(ngModel)]="settings.ownerName"></div>
    <div class="form-row">
      <div class="field"><label>Default Milk Rate (₹/L)</label><input class="input" type="number" step="0.5" [(ngModel)]="settings.defaultRate"></div>
      <div class="field"><label>Currency</label><input class="input" [(ngModel)]="settings.currency"></div>
    </div>
    <button class="btn btn-primary" (click)="save()">Save Settings</button>
  </div>

  <div class="card">
    <h3>Sync</h3>
    <p class="mt">Status:
      <span class="badge" [ngClass]="sync.state() === 'synced' ? 'ok' : (sync.state() === 'offline' ? 'low' : 'pending')">{{ sync.label() }}</span>
    </p>
    @if (lastSynced()) { <p class="muted">Last synced: {{ lastSynced() | date:'medium' }}</p> }
    <button class="btn btn-primary mt" (click)="syncNow()">🔄 Sync Now</button>
    <p class="muted mt" style="font-size:.82rem">Offline SQLite sync (Dotmim.Sync) is wired in the desktop build; the web app talks to the server directly.</p>

    <h3 class="mt">Danger zone</h3>
    <button class="btn btn-danger" (click)="clearLocal()">Clear local settings</button>
  </div>
</div>
